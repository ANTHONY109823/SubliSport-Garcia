services:
  db:
    image: postgres:16-alpine
    container_name: sublisport-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sublisport
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sublisport"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sublisport-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=sublisport;Username=postgres;Password=postgres"
      Seed__SuperAdminEmail: "admin@sublisport.local"
      Seed__SuperAdminPassword: "SuperAdmin2026!"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
